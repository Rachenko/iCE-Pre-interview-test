services:
  db:
    image: postgres:17-alpine
    container_name: pm-db
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Auto-initialize schema + seed data on first start
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Host dir for backups written by scripts/backup.sh
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitoring"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: pm-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=monitoring;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # Central log volume used by scripts/log-rotate.sh demo
      - ./logs:/app/logs

volumes:
  db-data:
